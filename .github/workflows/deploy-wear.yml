name: Deploy Watch to Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wear_deploy:
    name: Wear OS Production Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > app/release.keystore

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Deploy Watch to Wear Production
        run: bundle exec fastlane deploy_wear_production
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          BUILD_NUMBER: ${{ github.run_number }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
